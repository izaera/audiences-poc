<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Northwind — Contact</title>
		<link rel="stylesheet" href="/styles.css" />
		<script type="module" src="/index.js"></script>
	</head>
	<body>
		<header class="site-header">
			<div class="container">
				<a href="index.html" class="logo">North<span>wind</span></a>
				<nav class="nav">
					<a href="/index.html">Home</a>
					<a href="/shopping-site/products.html">Products</a>
					<a href="/legal-site/contact.html" class="active">Contact</a>
					<a href="/legal-site/about.html">About us</a>
				</nav>
			</div>
		</header>

		<main>
			<section class="page-title">
				<div class="container">
					<h1>Get in touch</h1>
					<p>
						Have a question, a partnership idea, or just want to say
						hi? We would love to hear from you.
					</p>
				</div>
			</section>

			<section class="section">
				<div class="container">
					<div class="contact-info">
						<div>
							<strong>Email</strong>
							<span>hello@northwind.example</span>
						</div>
						<div>
							<strong>Phone</strong>
							<span>+34 900 000 000</span>
						</div>
						<div>
							<strong>Office</strong>
							<span>Barcelona, Spain</span>
						</div>
					</div>

					<form class="form" onsubmit="event.preventDefault(); alert('Thanks — we will be in touch.');">
						<div class="field">
							<label for="name">Name</label>
							<input id="name" name="name" type="text" required placeholder="Your name" />
						</div>
						<div class="field">
							<label for="email">Email</label>
							<input id="email" name="email" type="email" required placeholder="you@example.com" />
						</div>
						<div class="field">
							<label for="message">Message</label>
							<textarea id="message" name="message" required placeholder="How can we help?"></textarea>
						</div>
						<button type="submit" class="cta">Send message</button>
					</form>
				</div>
			</section>
		</main>

		<footer class="site-footer">
			<div class="container">
				&copy; 2026 Northwind. All rights reserved.
			</div>
		</footer>
	</body>
</html>
